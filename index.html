<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Markazi+Text:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="app-style">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --ink:#22252a; --ink-soft:#5b6169; --ink-faint:#8d929b;
  --bg:#fafbfa; --surface:#ffffff; --line:#e9ebe9;
  --cell-bg:#f6f7f7;
  --green-600:#3f6b3f; --green-700:#305430; --green-100:#eaf5ee;
  --blue-100:#eaf2fb; --blue-ink:#3f6f92;
  --sand-100:#faf5e9;
  --lavender-100:#f3f0f9; --lavender-ink:#6c5a92;
  --cream-100:#fdf8e3;
  --rose-100:#fbeef0; --rose-ink:#a24f5e;
  --mint-100:#e9f6f0; --mint-ink:#3f8d6d;
  --gold:#a97d2a; --gold-bg:#f6ecd6;
  --urgent:#b23b28; --urgent-bg:#faeae6;
  --sky:#3f6f92; --sky-bg:#eaf2f8;
  --btn-bg:#3f6b3f; --btn-text:#fbfaf4;
  --shadow:0 1px 2px rgba(20,20,20,.02);
  --radius-lg:18px; --radius-md:13px; --radius-sm:10px;
  --focus:#3f6b3f;
}
/* دارنا يعتمد هوية فاتحة ثابتة دائمًا (Clean / Premium / Family Portal) — لا نتبع
   إعداد الوضع الداكن في نظام الجهاز تلقائيًا، حتى لا تظهر الواجهة غامقة على أي شخص
   بالعائلة بشكل غير مقصود. القيم أدناه محفوظة لتفعيل تبديل يدوي مستقبلي لو احتجناه. */
:root[data-theme="dark"]{
  --ink:#eae7da; --ink-soft:#b6b4a6; --ink-faint:#82877a;
  --bg:#15180f; --surface:#1d2117; --line:#2f3427;
  --cell-bg:#20241a;
  --green-600:#8fc478; --green-700:#a3d38d; --green-100:#212a1b;
  --blue-100:#1a222a; --blue-ink:#8bb6d6;
  --sand-100:#241f16;
  --lavender-100:#211d29; --lavender-ink:#b6a2dc;
  --cream-100:#2c2712;
  --rose-100:#2a1a1c; --rose-ink:#e2a6ae;
  --mint-100:#17271f; --mint-ink:#7fd1ac;
  --gold:#dcae5f; --gold-bg:#2c2410;
  --urgent:#e0796a; --urgent-bg:#31201b;
  --sky:#8bb6d6; --sky-bg:#1a2530;
  --btn-bg:#7fb166; --btn-text:#12160d;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.5);
  --focus:#8fc478;
}
html,body{background:var(--bg);}
body{
  margin:0; color:var(--ink); background:var(--bg);
  font-family:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  font-size:15.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
.wordmark{font-family:"Markazi Text","IBM Plex Sans Arabic",serif; font-weight:700;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
:focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:6px;}
.icon{width:1em; height:1em; display:inline-block; vertical-align:-0.15em;}
.icon svg{width:100%; height:100%;}
.shell{max-width:1180px; margin:0 auto; padding:0 16px;}

/* header */
.topbar{position:sticky; top:0; z-index:20; background:var(--bg); background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; flex-wrap:wrap;}
.brand{display:flex; flex-direction:column; gap:1px;}
.brand-link{text-decoration:none; color:inherit; display:flex; flex-direction:column; gap:1px;}
.brand-name{font-size:26px; color:var(--green-600); line-height:1;}
.brand-sub{font-size:12.5px; color:var(--ink-faint);}
.topbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.sync-badge{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-faint); padding:6px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--line); white-space:nowrap;}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none;}
.sync-badge.on .sync-dot{background:var(--green-600);}
.sync-badge.off .sync-dot{background:var(--gold);}
.admin-toggle{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-soft); padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); white-space:nowrap;}
.admin-toggle .icon{width:13px; height:13px;}
.admin-toggle.on{background:var(--green-600); color:var(--btn-text); border-color:var(--green-600);}
.today-line{padding:2px 16px 12px; font-size:13px; color:var(--ink-soft);}

/* page nav (person/section pages) */
.page-nav{max-width:1180px; margin:0 auto; padding:10px 16px 0;}
.back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-soft); text-decoration:none; padding:6px 4px;}
.back-link:hover{color:var(--green-600);}

/* identity banner */
.identity-banner{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; margin:0 auto 10px; max-width:1180px; background:var(--lavender-100); border-radius:var(--radius-md); font-size:13.5px;}
.identity-banner input{flex:1; min-width:120px; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--radius-sm); padding:8px 12px; font-size:13.5px;}

/* search */
.searchbar-wrap{padding:0 16px 12px;}
.searchbar{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:10px 16px;}
.searchbar .icon{color:var(--ink-faint); flex:none;}
.searchbar input{flex:1; border:none; background:transparent; font-size:14.5px; outline:none;}
.search-clear{border:none; background:var(--cell-bg); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:none;}
.search-clear .icon{width:13px; height:13px;}
#searchResults{max-width:1180px; margin:0 auto; padding:0 16px 14px;}
#searchResults:empty{display:none;}

/* people strip (home) */
.people-strip-wrap{padding:6px 16px 14px;}
.people-strip{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
@media (max-width:640px){ .people-strip{grid-template-columns:repeat(4,1fr); gap:10px;} }
@media (max-width:380px){ .people-strip{grid-template-columns:repeat(3,1fr);} }
.person-card{display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; color:var(--ink); padding:10px 4px; border-radius:var(--radius-md); min-width:0;}
.person-card:hover{background:var(--cell-bg);}
.person-avatar{width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; border:1px solid var(--line); flex:none;}
.person-name{font-size:12px; font-weight:600; text-align:center; white-space:nowrap;}
.person-mood-em{font-size:11px;}

/* shortcuts */
.shortcuts-wrap{padding:0 16px 16px;}
.shortcuts-grid{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media (max-width:640px){ .shortcuts-grid{grid-template-columns:repeat(3,1fr);} }
.shortcut-card{display:flex; flex-direction:column; align-items:center; gap:7px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 6px; text-align:center; box-shadow:var(--shadow);}
.shortcut-card:hover{border-color:var(--green-600);}
.shortcut-card .icon{width:20px; height:20px; color:var(--green-600);}
.shortcut-card span{font-size:11.5px; font-weight:600;}

/* home results grid */
.home-grid{max-width:1180px; margin:0 auto; padding:0 16px 20px; display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:760px){ .home-grid{grid-template-columns:1fr 1fr;} }
@media (min-width:1080px){ .home-grid{grid-template-columns:1fr 1fr 1fr;} }
.home-grid .card{margin:0;}
.card-head .see-all{margin-inline-start:auto;}
.see-all{font-size:11.5px; color:var(--green-600); font-weight:700; text-decoration:none; white-space:nowrap;}
.see-all:hover{text-decoration:underline;}
.hgrid-span2{grid-column:span 1;}
@media (min-width:760px){ .hgrid-span2{grid-column:span 2;} }

.mood-row{display:flex; flex-wrap:wrap; gap:8px;}
.mood-chip{display:flex; align-items:center; gap:6px; background:var(--cell-bg); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:12.5px;}
.mood-chip .em{font-size:16px;}
.mood-chip.unset{opacity:.5;}

.fav-row{display:flex; flex-wrap:wrap; gap:8px;}
.fav-chip{display:flex; align-items:center; gap:6px; background:var(--gold-bg); color:var(--gold); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; text-decoration:none;}
.fav-chip .icon{width:12px; height:12px;}

.activity-list{display:flex; flex-direction:column; gap:0;}
.activity-row{font-size:12.5px; color:var(--ink-soft); padding:7px 0; border-bottom:1px dashed var(--line);}
.activity-row:last-child{border-bottom:none;}
.activity-row b{color:var(--ink); font-weight:600;}
.activity-time{color:var(--ink-faint); font-size:11px; margin-inline-start:6px;}

/* person page */
.person-hero-wrap{padding:6px 16px 14px;}
.person-hero{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.person-hero .person-avatar{width:60px; height:60px; font-size:28px;}
.person-hero-name{font-size:22px; font-weight:700; font-family:"Markazi Text",serif;}
.person-hero-mood{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px;}
.mood-btn{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; width:36px; height:36px; font-size:17px; display:flex; align-items:center; justify-content:center;}
.mood-btn.active{border-color:var(--green-600); background:var(--green-100);}
.mood-note-input{border:1.5px solid var(--line); background:var(--surface); border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px; min-width:150px;}

.quickadd-grid-wrap{padding:0 16px 16px;}
.quickadd-grid{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
@media (max-width:640px){ .quickadd-grid{grid-template-columns:repeat(3,1fr);} }
.quickadd-tile{display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--surface); border:1.5px dashed var(--line); border-radius:var(--radius-md); padding:12px 6px; font-size:11.5px; font-weight:600; color:var(--ink-soft);}
.quickadd-tile:hover{border-color:var(--green-600); color:var(--green-600);}
.quickadd-tile .icon{width:18px; height:18px;}

/* section pages */
.section-title-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; max-width:1180px; margin:0 auto; padding:10px 16px 14px;}
.section-title{font-size:24px; font-family:"Markazi Text",serif; font-weight:700; color:var(--green-600); display:flex; align-items:center; gap:8px; margin:0;}
.section-wrap{max-width:1180px; margin:0 auto; padding:0 16px 24px; display:flex; flex-direction:column; gap:14px;}

/* entity form */
.entity-form-host{padding:0 16px 14px;}
.entity-form-host.hidden{display:none;}
.entity-form-card{max-width:1180px; margin:0 auto; background:var(--surface); border:1.5px dashed var(--green-600); border-radius:var(--radius-lg); padding:16px;}
.confirm-sender{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; background:var(--lavender-100); display:inline-block; padding:4px 10px; border-radius:999px;}
.field-grid{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.field-grid .field{flex:1; min-width:170px;}
.field-grid label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field-grid input[type=text],.field-grid input[type=date],.field-grid input[type=email],.field-grid input[type=tel],.field-grid select,.field-grid textarea{width:100%; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--radius-sm); padding:10px 12px; font-size:14.5px; font-family:inherit;}
.field-grid textarea{resize:vertical; min-height:64px;}
.field-grid input[disabled]{background:var(--cell-bg); color:var(--ink-soft);}

/* quick add / family box (moved to its own page) */
.quickadd-wrap{padding:4px 16px 12px;}
.quickadd-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:14px; max-width:1180px; margin:0 auto;}
.quickadd-label{font-size:13px; color:var(--ink-soft); margin:0 2px 8px; font-weight:600;}
.quickadd-row{display:flex; gap:8px;}
.quickadd-row input{flex:1; border:1.5px solid var(--line); background:var(--cell-bg); border-radius:var(--radius-md); padding:13px 16px; font-size:15.5px; color:var(--ink);}
.quickadd-row input::placeholder{color:var(--ink-faint);}
.quickadd-row input:focus{border-color:var(--green-600); background:var(--surface);}
.btn{border:none; border-radius:var(--radius-md); padding:13px 20px; font-size:15px; font-weight:600; display:inline-flex; align-items:center; gap:6px; justify-content:center;}
.btn-primary{background:var(--btn-bg); color:var(--btn-text);}
.btn-primary:hover{background:var(--green-700);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
.btn-ghost:hover{background:var(--cell-bg);}
.btn-sm{padding:8px 14px; font-size:13.5px; border-radius:10px;}
.quickadd-hint{margin:8px 2px 0; font-size:12px; color:var(--ink-faint);}

.familybox-wrap{padding:0 16px 14px;}
.card--familybox{background:var(--lavender-100); border-color:var(--line); max-width:1180px; margin:0 auto;}
.familybox-hint{margin:0 0 10px; font-size:12.5px; color:var(--ink-soft);}
.familybox-form{display:flex; gap:8px; flex-wrap:wrap;}
.familybox-form input{border:1.5px solid var(--line); background:var(--surface); border-radius:var(--radius-md); padding:11px 14px; font-size:14.5px;}
.familybox-form input#familyboxName{flex:0 0 130px;}
.familybox-form input#familyboxText{flex:1; min-width:160px;}
.familybox-form .btn{flex:none;}

.type-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.type-chip{border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:8px 16px; font-size:14px; font-weight:600;}
.type-chip.active{background:var(--green-600); border-color:var(--green-600); color:var(--btn-text);}
.type-chip.small{padding:6px 12px; font-size:12.5px;}
.confirm-title{font-size:13px; font-weight:700; color:var(--green-600); margin:0 0 10px;}
.confirm-subtitle{font-size:12px; font-weight:700; color:var(--ink-soft); margin:2px 0 8px;}
.confirm-actions{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
.confirm-danger{margin-inline-end:auto;}
.btn-danger{background:transparent; color:var(--urgent); border:1.5px solid var(--urgent-bg);}
.btn-danger:hover{background:var(--urgent-bg);}

/* stat tiles */
.stats-row{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:640px){ .stats-row{grid-template-columns:1fr 1fr;} }
.stat-tile{padding:14px 16px;}
.card--thisweek{background:var(--sand-100);}
.card--urgent{background:var(--cream-100);}
.stat-title{margin:0 0 6px; font-size:13px; font-weight:700; color:var(--ink);}
.stat-line{margin:0; font-size:13px; color:var(--ink-soft);}
.row-mini{font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line);}
.row-mini:last-child{border-bottom:none;}

/* pending approval */
.pending-wrap{padding:0 16px 14px;}
.card--pending{background:var(--surface); border:1.5px dashed var(--green-600); max-width:1180px; margin:0 auto;}
.pending-actions{flex-wrap:wrap; gap:6px;}

/* card */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:18px;}
.card--reminders{background:var(--green-100);}
.card--requests{background:var(--blue-100);}
.card--tasks{background:var(--mint-100);}
.card--bills{background:var(--rose-100);}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px;}
.card-title{font-size:16px; font-weight:700; margin:0; display:flex; align-items:center; gap:8px;}
.card-title .icon{color:var(--green-600);}
.card-count{font-size:12px; color:var(--ink-faint); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px 9px;}
.empty-note{color:var(--ink-faint); font-size:13.5px; padding:10px 2px;}

/* calendar */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-nav-btn{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:var(--cell-bg); color:var(--ink); font-size:18px; display:flex; align-items:center; justify-content:center;}
.cal-nav-btn:hover{background:var(--green-100);}
.cal-month-title{font-family:"Markazi Text",serif; font-weight:700; font-size:24px; color:var(--green-600);}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
.cal-weekdays span{text-align:center; font-size:11.5px; color:var(--ink-faint); font-weight:600;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-cell{background:transparent; border:1px solid transparent; border-radius:12px; min-height:64px; padding:5px; display:flex; flex-direction:column; align-items:stretch; gap:2px; text-align:right; color:var(--ink); overflow:hidden;}
.cal-cell.empty{visibility:hidden;}
.cal-cell:not(.empty){border-color:var(--line); background:var(--cell-bg);}
.cal-cell:not(.empty):hover{border-color:var(--green-600);}
.cal-cell.today{border-color:var(--green-600); background:var(--green-100);}
.cal-daynum{font-size:12.5px; font-weight:700; color:var(--ink-soft); align-self:flex-start;}
.cal-cell.today .cal-daynum{color:var(--green-600);}
.cal-chip{font-size:10.5px; border-radius:6px; padding:2px 5px; background:var(--green-100); color:var(--green-600); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-chip.k-appt{background:var(--sky-bg); color:var(--sky);}
.cal-chip.k-urgent{background:var(--urgent-bg); color:var(--urgent);}
.cal-chip.k-warn{background:var(--gold-bg); color:var(--gold);}
.cal-chip.k-gold{background:var(--sand-100); color:var(--ink-soft);}
.cal-chip.k-birthday{background:var(--lavender-100); color:var(--lavender-ink);}
.cal-chip.k-national{background:var(--blue-100); color:var(--blue-ink);}
.cal-more{font-size:10px; color:var(--ink-faint); padding:0 5px;}
@media (max-width:520px){
  .cal-cell{min-height:50px; font-size:11px;}
  .cal-chip{display:none;}
  .cal-cell.has-items:not(.empty)::after{content:""; width:5px; height:5px; border-radius:50%; background:var(--green-600); align-self:center; margin-top:auto;}
}

/* lists */
.list{display:flex; flex-direction:column; gap:8px;}
.list.compact{gap:0;}
.row{display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface);}
.row.pending-row{flex-wrap:wrap;}
.row.pending-row .row-actions{width:100%; margin-top:6px;}
.row-main{flex:1; min-width:0;}
.row-title{font-size:14.5px; font-weight:600; color:var(--ink); word-break:break-word;}
.row-title.done{color:var(--ink-faint); text-decoration:line-through; font-weight:500;}
.row-title.clickable{cursor:pointer;}
.row-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.row-meta{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.row-note{font-size:12px; color:var(--ink-soft); margin-top:2px; font-style:italic;}
.row-badges{margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.row-actions{display:flex; align-items:center; gap:6px; flex:none;}
.icon-btn{width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:none;}
.icon-btn .icon{width:16px; height:16px;}
.icon-btn:hover{background:var(--green-100); color:var(--green-600);}
.pill{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;}
.pill.urgent{background:var(--urgent-bg); color:var(--urgent);}
.pill.warn{background:var(--gold-bg); color:var(--gold);}
.pill.ok{background:var(--green-100); color:var(--green-600);}
.pill.muted{background:var(--surface); color:var(--ink-faint); border:1px solid var(--line);}
.req-title-input{width:100%; border:1.5px solid var(--green-600); border-radius:8px; padding:6px 9px; font-size:14.5px; background:var(--surface);}
.status-btn{border:1.5px solid var(--green-600); color:var(--green-600); background:transparent; border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:700; white-space:nowrap;}
.status-btn:hover{background:var(--green-100);}
.status-btn.is-done{border-color:var(--line); color:var(--ink-faint); background:var(--surface);}
.status-secondary{border:none; background:none; color:var(--ink-faint); font-size:12px; text-decoration:underline; padding:4px;}
.star-btn{background:none; border:none; color:var(--ink-faint); font-size:15px; padding:3px; flex:none; display:flex; align-items:center;}
.star-btn .icon{width:16px; height:16px;}
.star-btn.on{color:var(--gold);}
.tel-link{color:var(--green-600); text-decoration:none; display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; margin-top:4px;}

/* vehicles */
.vehicles-grid{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:700px){ .vehicles-grid{grid-template-columns:1fr 1fr;} }
.vehicle-card{border-top:3px solid var(--green-600);}
.vehicle-facts{margin:10px 0;}
.vehicle-fact{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--line);}
.vehicle-fact:last-child{border-bottom:none;}
.vehicle-fact b{color:var(--ink-soft); font-weight:600;}

/* fab */
.fab{position:fixed; inset-inline-end:20px; inset-block-end:24px; width:58px; height:58px; border-radius:50%; background:var(--btn-bg); color:var(--btn-text); border:none; box-shadow:0 8px 18px -6px rgba(20,20,20,.16); display:flex; align-items:center; justify-content:center; font-size:26px; z-index:30;}
.fab .icon{width:26px; height:26px;}
.fab:hover{background:var(--green-700);}
.fab.hidden{display:none;}
@media (max-width:640px){ .fab{inset-block-end:calc(20px + env(safe-area-inset-bottom));} }

/* toast */
.toast-host{position:fixed; inset-inline:0; bottom:20px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none; padding:0 16px;}
.toast{pointer-events:auto; background:var(--ink); color:var(--bg); border-radius:12px; padding:11px 16px; display:flex; align-items:center; gap:12px; font-size:13.5px; box-shadow:0 8px 20px -8px rgba(20,20,20,.28); opacity:1; transform:translateY(0); transition:opacity .25s, transform .25s; max-width:92vw;}
.toast.out{opacity:0; transform:translateY(8px);}
.toast-action{background:none; border:none; color:var(--green-100); font-weight:700; font-size:13px; white-space:nowrap;}

.foot-note{max-width:1180px; margin:8px auto 40px; padding:0 16px; font-size:12px; color:var(--ink-faint); text-align:center;}

/* ---------- mobile / small screen: comfortable admin editing ---------- */
@media (max-width:640px){
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{overflow-x:hidden;}
  /* منع تكبير iOS التلقائي عند التركيز على أي حقل (سبب شائع لإحساس "الواجهة تصغّرت/ترزّحت") */
  input, select, textarea, button{font-size:16px;}
  /* القاعدة العامة أعلاه لا تكفي وحدها: بعض حقول النماذج لها Selector أخص (class + attribute)
     يتغلب عليها حسب قواعد CSS Specificity رغم وجودها هنا لاحقًا في الملف — لهذا نكررها هنا
     بنفس درجة الخصوصية لضمان أن كل حقول الإدخال فعليًا تصير 16px على الجوال، بما فيها نماذج
     الإضافة (معلومة/مرجع/موعد/تذكير...)، شريط البحث، وصندوق العائلة. */
  .field-grid input[type=text],.field-grid input[type=date],.field-grid input[type=email],.field-grid input[type=tel],.field-grid select,.field-grid textarea,
  .searchbar input,.familybox-form input,.req-title-input{font-size:16px;}
  .btn-sm{font-size:14.5px;}
  .pill, .sync-badge, .admin-toggle, .card-count{font-size:12px;}

  /* أزرار وأهداف لمس أكبر */
  .icon-btn{width:40px; height:40px; border-radius:11px;}
  .icon-btn .icon{width:18px; height:18px;}
  .star-btn{padding:8px;}
  .mood-btn{width:44px; height:44px; font-size:19px;}
  .cal-nav-btn{width:40px; height:40px;}
  .admin-toggle{padding:9px 14px;}
  .btn{padding:13px 18px; min-height:44px;}
  .btn-sm{padding:10px 16px; min-height:40px;}
  .search-clear{width:32px; height:32px;}
  .quickadd-tile{padding:14px 6px; min-height:76px; font-size:12px;}
  .quickadd-tile .icon{width:20px; height:20px;}
  .quickadd-grid{grid-template-columns:repeat(3,1fr); gap:8px;}

  /* الحقول تصير كل وحدة بعرض كامل عشان ما تتزاحم */
  .field-grid{gap:12px;}
  .field-grid .field{flex:1 1 100%; min-width:0;}

  /* Forms والبطاقات بعرض الجوال كامل بدون تضييق زائد */
  .entity-form-card{padding:14px;}
  .shell, .page-nav, .identity-banner, .searchbar-wrap, #searchResults,
  .people-strip-wrap, .shortcuts-wrap, .quickadd-grid-wrap, .entity-form-host,
  .person-hero-wrap, .section-title-row, .section-wrap, .pending-wrap,
  .home-grid, .foot-note{ padding-inline:12px; }

  .person-hero-name{font-size:19px;}
  .person-avatar{width:44px; height:44px; font-size:19px;}
  .person-hero .person-avatar{width:52px; height:52px; font-size:24px;}

  .familybox-form input#familyboxName{flex:1 1 100%;}
  .familybox-form input#familyboxText{flex:1 1 100%;}
  .familybox-form .btn{width:100%;}
}
@media (max-width:360px){
  .quickadd-grid{grid-template-columns:repeat(2,1fr);}
}

var WEEKDAYS_FULL=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

function fmtHumanDate(iso){
  if(!iso) return "";
  var d=parseISO(iso);
  return d.getDate()+" "+MONTHS[d.getMonth()];
}
function fmtRelative(iso){
  var d=parseISO(iso), t=todayDate();
  var diff=daysBetween(t,d);
  if(diff===0) return "اليوم";
  if(diff===1) return "غدًا";
  if(diff===-1) return "أمس";
  if(diff>1) return "بعد "+diff+" يوم";
  return "متأخر "+Math.abs(diff)+" يوم";
}
function urgencyTier(iso){
  var diff=daysBetween(todayDate(), parseISO(iso));
  if(diff<0) return "urgent";
  if(diff<=3) return "urgent";
  if(diff<=7) return "warn";
  return "ok";
}
function importanceBadge(imp){
  if(imp==="عاجل") return '<span class="pill urgent">عاجل</span>';
  if(imp==="مهم") return '<span class="pill warn">مهم</span>';
  return "";
}
function arDaysPhrase(n){
  if(n<0) return "متأخر "+Math.abs(n)+" يوم";
  if(n===0) return "اليوم";
  if(n===1) return "غدًا";
  if(n===2) return "بعد يومين";
  if(n<=10) return "بعد "+n+" أيام";
  return "بعد "+n+" يومًا";
}
function fmtRelativeLong(iso){
  var diff=daysBetween(todayDate(), parseISO(iso));
  if(diff>=2 && diff<=6) return WEEKDAYS_FULL[parseISO(iso).getDay()];
  if(diff>20) return fmtHumanDate(iso);
  return arDaysPhrase(diff);
}
function fmtAddedAt(iso){
  if(!iso) return "";
  var d=new Date(iso); d.setHours(0,0,0,0);
  var diff=daysBetween(d, todayDate());
  if(diff<=0) return "اليوم";
  if(diff===1) return "أمس";
  return "قبل "+diff+" يوم";
}

/* ---------- quick-add parsing (used by family box free-text box) ---------- */
var REQUEST_KW=["جيب","هات","اشتري","إشتري","احجز","إحجز","اطلب","إطلب","ابغى","أبغى","نبغى","نحتاج","تحتاج له","دلوني على"];
var EVENT_KW={
  "عيد ميلاد":["عيد ميلاد","ميلاد"],
  "مناسبة وطنية":["اليوم الوطني","وطني"],
  "تجديد":["تجديد","تجديدات","يتجدد","رخصة","ترخيص"],
  "سفر":["سفر","رحلة","سفرية","مطار","طيران","نسافر"],
  "موعد":["موعد","دكتور","طبيب","مستشفى","عيادة","كشف","فحص"],
  "تذكير":["ينتهي","تنتهي","ينهي","خلص","يخلص","باقي","ينزل"],
  "مناسبة":["زواج","خطوبة","حفل","مناسبة"]
};
function detectType(text){
  var i,k;
  for(i=0;i<REQUEST_KW.length;i++){ if(text.indexOf(REQUEST_KW[i])>-1) return "طلب"; }
  var types=["عيد ميلاد","مناسبة وطنية","تجديد","سفر","موعد","تذكير","مناسبة"];
  for(i=0;i<types.length;i++){
    var kws=EVENT_KW[types[i]];
    for(k=0;k<kws.length;k++){ if(text.indexOf(kws[k])>-1) return types[i]; }
  }
  return "مناسبة";
}
function parseDateFromText(text){
  var today=todayDate();
  var m;
  if(/اليوم/.test(text)) return {date:toISO(today), match:"اليوم"};
  m=text.match(/بكرة|غدا|غدًا/);
  if(m){ var d1=new Date(today); d1.setDate(d1.getDate()+1); return {date:toISO(d1), match:m[0]}; }
  m=text.match(/بعد\s*(\d+)\s*(يوم|أيام)/);
  if(m){ var d2=new Date(today); d2.setDate(d2.getDate()+parseInt(m[1],10)); return {date:toISO(d2), match:m[0]}; }
  m=text.match(/بعد\s*أسبوعين/);
  if(m){ var d3=new Date(today); d3.setDate(d3.getDate()+14); return {date:toISO(d3), match:m[0]}; }
  m=text.match(/بعد\s*أسبوع/);
  if(m){ var d4=new Date(today); d4.setDate(d4.getDate()+7); return {date:toISO(d4), match:m[0]}; }
  m=text.match(/بعد\s*شهر/);
  if(m){ var d5=new Date(today); d5.setMonth(d5.getMonth()+1); return {date:toISO(d5), match:m[0]}; }
  var monthPattern=MONTHS.join("|")+"|إبريل";
  m=text.match(new RegExp("(\\d{1,2})\\s*("+monthPattern+")(?:\\s+(\\d{4}))?"));
  if(m){
    var day=parseInt(m[1],10);
    var monthIdx=MONTHS.indexOf(m[2]);
    if(monthIdx<0 && m[2]==="إبريل") monthIdx=3;
    var year=m[3]?parseInt(m[3],10):today.getFullYear();
    if(!m[3]){
      var guess=new Date(year,monthIdx,day);
      if(daysBetween(today,guess) < -20) year+=1;
    }
    var dd=new Date(year,monthIdx,day);
    return {date:toISO(dd), match:m[0]};
  }
  return {date:toISO(today), match:null};
}
function parseQuickAdd(raw){
  var text=normalizeDigits(raw.trim());
  var type=detectType(text);
  if(type==="طلب"){ return {type:type, title:text, date:null}; }
  var parsed=parseDateFromText(text);
  var title=text;
  if(parsed.match){ title=text.replace(parsed.match,"").replace(/\s{2,}/g," ").trim(); }
  if(!title) title=text;
  return {type:type, title:title, date:parsed.date};
}

/* ---------- toasts ---------- */
function showToast(msg, actionLabel, actionFn, duration){
  duration=duration||4200;
  var host=document.getElementById("toastHost");
  if(!host) return;
  var el=document.createElement("div");
  el.className="toast";
  var span=document.createElement("span");
  span.textContent=msg;
  el.appendChild(span);
  if(actionLabel && actionFn){
    var btn=document.createElement("button");
    btn.type="button"; btn.className="toast-action"; btn.textContent=actionLabel;
    btn.addEventListener("click",function(){ actionFn(); el.remove(); });
    el.appendChild(btn);
  }
  host.appendChild(el);
  setTimeout(function(){ el.classList.add("out"); setTimeout(function(){ el.remove(); },300); }, duration);
}

function saveEntity(entity, mode, id, fields){
  var cfg=ENTITY_CONFIG[entity];
  var row=cfg.toRow(fields);
  if(mode==="edit" && id){
    return sb.from(cfg.table).update(row).eq("id",id).select().single().then(function(res){
      if(res.error){ showToast("تعذّر التحديث"); throw res.error; }
      var list=cfg.list();
      var existing=list.find(function(x){return x.id===id;});
      var mapped=cfg.fromRow(res.data);
      if(existing) Object.assign(existing, mapped);
      return mapped;
    });
  }
  return sb.from(cfg.table).insert(row).select().single().then(function(res){
    if(res.error){ showToast("تعذّر الحفظ — تأكد إنك مسجّل دخول كمدير"); throw res.error; }
    var mapped=cfg.fromRow(res.data);
    cfg.list().push(mapped);
    return mapped;
  });
}

  var cfg=ENTITY_CONFIG[entity];
  var list=cfg.list();
  var idx=list.findIndex(function(x){return x.id===id;});
  var removed = idx>=0 ? list[idx] : null;
  return sb.from(cfg.table).delete().eq("id",id).then(function(res){
    if(res.error){ showToast("تعذّر الحذف"); throw res.error; }
    if(idx>=0) list.splice(idx,1);
    return removed;
  });
}

/* ---------- global search (token-based, across all entities) ---------- */
var SEARCH_STOPWORDS=["في","من","على","عن","الى","إلى","و","مع","او","أو"];
function searchTokens(q){
  return normalizeDigits(q).trim().split(/\s+/).filter(function(t){ return t && SEARCH_STOPWORDS.indexOf(t)===-1; });
}
function matchesTokens(haystack, tokens){
  if(!tokens.length) return false;
  return tokens.every(function(t){ return haystack.indexOf(t)>-1; });
}
function searchAll(query){
  var tokens=searchTokens(query);
  if(!tokens.length) return [];
  var out=[];
  state.items.forEach(function(it){
    var hs=normalizeDigits([it.title,it.type,it.note,it.forWhom].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"item",label:it.title,sub:it.type+" · "+fmtHumanDate(it.date),href:it.forWhom?navHref("person",it.forWhom):navHref("section","calendar")});
  });
  state.requests.forEach(function(r){
    var hs=normalizeDigits([r.text,r.note,r.forWhom,r.assignee,"طلب"].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"request",label:r.text,sub:"طلب · "+r.status,href:navHref("section","requests")});
  });
  state.tasks.forEach(function(t){
    var hs=normalizeDigits([t.task,t.note,t.forWhom,t.assignee,"مهمة"].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"task",label:t.task,sub:"مهمة · "+t.status,href:navHref("section","tasks")});
  });
  state.bills.forEach(function(b){
    var hs=normalizeDigits([b.name,b.type,b.provider,b.accountNumber,b.responsible,b.note].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"bill",label:b.name,sub:"فاتورة/خدمة"+(b.dueDate?(" · تستحق "+fmtHumanDate(b.dueDate)):""),href:navHref("section","bills")});
  });
  state.subscriptions.forEach(function(s){
    var hs=normalizeDigits([s.name,s.owner,s.email,s.note,"اشتراك"].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"subscription",label:s.name,sub:"اشتراك · "+s.status,href:navHref("section","subscriptions")});
  });
  state.vehicles.forEach(function(v){
    var hs=normalizeDigits([v.name,v.owner,v.plateNumber,v.maintenanceNote,v.note,"سيارة تأمين استمارة فحص"].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"vehicle",label:v.name,sub:"سيارة"+(v.owner?(" · "+v.owner):""),href:navHref("section","vehicles")});
  });
  state.numbers.forEach(function(n){
    var hs=normalizeDigits([n.name,n.category,n.phone,n.note,n.forWhom].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"number",label:n.name,sub:"رقم مهم"+(n.category?(" · "+n.category):""),href:navHref("section","numbers")});
  });
  state.references.forEach(function(rf){
    var hs=normalizeDigits([rf.person,rf.entity,rf.refType,rf.refValue,rf.note,rf.category].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"reference",label:(rf.refType?rf.refType+" — ":"")+rf.refValue,sub:"مرجع "+rf.person+(rf.entity?(" · "+rf.entity):""),href:navHref("person",rf.person)});
  });
  state.notes.forEach(function(nt){
    var hs=normalizeDigits([nt.person,nt.text].join(" "));
    if(matchesTokens(hs,tokens)) out.push({kind:"note",label:nt.text,sub:"ملاحظة "+nt.person,href:navHref("person",nt.person)});
  });
  PEOPLE.forEach(function(p){
    var hs=normalizeDigits(p.name);
    if(matchesTokens(hs,tokens)) out.push({kind:"person",label:p.name,sub:"فرد من العائلة",href:navHref("person",p.name)});
  });
  return out;
}

/* ---------- home: compact result cards ---------- */
function upcomingItems(limit){
  var t=todayDate();
  return state.items.filter(function(it){ return daysBetween(t, parseISO(it.date))>=0; })
    .sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; })
    .slice(0,limit||7);
}
function chipKind(it){
  if(it.type==="تذكير"){
    var tier=urgencyTier(it.date);
    if(tier==="urgent") return "urgent";
    if(tier==="warn") return "warn";
    return "ok";
  }
  return typeMeta(it.type).kind;
}
function favIconBtn(entity, id, isFav){

function renderUpcomingCard(){
  var items=upcomingItems(7);

  if(!items.length){
    body='<div class="empty-note">ما فيه شيء قادم حاليًا.</div>';
  }else{
    body='<div class="list">'+items.map(function(it){
      var meta=typeMeta(it.type);
      var badge=importanceBadge(it.importance);
      var pillKind=chipKind(it);
      var pillClass=(pillKind==="urgent")?"urgent":(pillKind==="warn")?"warn":"ok";
      return '<div class="row" data-action="edit-item" data-id="'+it.id+'" role="button" tabindex="0">'+
        '<div class="row-main">'+
          '<div class="row-title">'+icon(meta.icon)+' '+escapeHtml(it.title)+'</div>'+
          (badge||it.forWhom?'<div class="row-badges">'+badge+(it.forWhom?'<span class="pill muted">'+escapeHtml(it.forWhom)+'</span>':'')+'</div>':'')+
          '<div class="row-sub">'+escapeHtml(it.type)+' · '+fmtHumanDate(it.date)+'</div>'+
        '</div>'+
        '<span class="pill '+pillClass+'">'+escapeHtml(fmtRelativeLong(it.date))+'</span>'+
      '</div>';
    }).join("")+'</div>';
  }
  return '<div class="card card--reminders hgrid-span2"><div class="card-head"><h3 class="card-title">'+icon("calendar")+' القادم</h3><span class="card-count">'+items.length+'</span></div>'+body+'</div>';
}
function thisWeekStats(){
  var t=todayDate();
  var end=new Date(t); end.setDate(end.getDate()+6);
  var endIso=toISO(end), tIso=toISO(t);
  var inWeek=function(it){ return it.date>=tIso && it.date<=endIso; };
  var occasions=state.items.filter(function(it){ return it.type!=="موعد" && it.type!=="تذكير" && inWeek(it); }).length;
  var appts=state.items.filter(function(it){ return it.type==="موعد" && inWeek(it); }).length;
  var openRequests=state.requests.filter(function(r){ return r.status!=="تم"; }).length;
  var needsAction=urgentNowList().length;
  return {occasions:occasions, appts:appts, requests:openRequests, needsAction:needsAction};
}
function billsDueSoon(days){
  var t=todayDate();
  return state.bills.filter(function(b){ return b.dueDate && daysBetween(t,parseISO(b.dueDate))>=-3 && daysBetween(t,parseISO(b.dueDate))<=(days||14); })
    .sort(function(a,b){ return a.dueDate<b.dueDate?-1:1; });
}
function vehicleDatesSoon(days){
  var t=todayDate();
  var out=[];
  state.vehicles.forEach(function(v){
    [["insuranceDate","تأمين"],["registrationDate","استمارة"],["inspectionDate","فحص دوري"]].forEach(function(pair){
      var d=v[pair[0]];
      if(d && daysBetween(t,parseISO(d))>=-3 && daysBetween(t,parseISO(d))<=(days||30)){
        out.push({vehicle:v, label:pair[1], date:d});
      }
    });
  });
  return out.sort(function(a,b){ return a.date<b.date?-1:1; });
}
function urgentNowList(){
  var remUrgent=state.items.filter(function(it){ return it.type==="تذكير" && urgencyTier(it.date)==="urgent"; });
  var flaggedItems=state.items.filter(function(it){ return it.importance==="عاجل" && it.type!=="تذكير"; });
  var flaggedReq=state.requests.filter(function(r){ return r.importance==="عاجل" && r.status!=="تم"; });
  var flaggedTasks=state.tasks.filter(function(t){ return t.importance==="عاجل" && t.status!=="مكتمل"; });
  var soonBills=billsDueSoon(3);
  var soonVehicles=vehicleDatesSoon(7);
  var out=[];
  remUrgent.forEach(function(x){ out.push({kind:"item",data:x}); });
  flaggedItems.forEach(function(x){ out.push({kind:"item",data:x}); });
  flaggedReq.forEach(function(x){ out.push({kind:"request",data:x}); });
  flaggedTasks.forEach(function(x){ out.push({kind:"task",data:x}); });
  soonBills.forEach(function(x){ out.push({kind:"bill",data:x}); });
  soonVehicles.forEach(function(x){ out.push({kind:"vehicle",data:x}); });
  return out.slice(0,6);
}
function urgentRowLabel(x){
  if(x.kind==="request") return "طلب عاجل: "+x.data.text;
  if(x.kind==="task") return "مهمة عاجلة: "+x.data.task;
  if(x.kind==="bill") return "فاتورة قريبة الاستحقاق: "+x.data.name+" — "+arDaysPhrase(daysBetween(todayDate(),parseISO(x.data.dueDate)));
  if(x.kind==="vehicle") return x.data.vehicle.name+" — "+x.data.label+" "+arDaysPhrase(daysBetween(todayDate(),parseISO(x.data.date)));
  var diff=daysBetween(todayDate(), parseISO(x.data.date));
  return x.data.title+" — "+arDaysPhrase(diff);
}
function renderStatsRow(){
  var stats=thisWeekStats();
  var urgent=urgentNowList();
  var urgentBody=urgent.length
    ? '<div class="list compact">'+urgent.map(function(x){
        return '<div class="row-mini">'+escapeHtml(urgentRowLabel(x))+'</div>';

    : '<div class="empty-note">ولا شي عاجل حاليًا.</div>';
  return '<div class="hgrid-span2 stats-row">'+
    '<div class="card card--urgent stat-tile"><h4 class="stat-title">الأمور العاجلة</h4>'+urgentBody+'</div>'+
    '<div class="card card--thisweek stat-tile"><h4 class="stat-title">هذا الأسبوع</h4><p class="stat-line">'+stats.occasions+' مناسبات · '+stats.appts+' مواعيد · '+stats.requests+' طلبات مفتوحة · '+stats.needsAction+' يحتاج إجراء</p></div>'+
  '</div>';
}

var ENTITY_TITLES={item:"عنصر",request:"طلب",task:"مهمة",bill:"فاتورة / خدمة",subscription:"اشتراك",vehicle:"سيارة",number:"رقم مهم",reference:"معلومة / مرجع",note:"ملاحظة"};
function renderFormPanel(){
  var el=document.getElementById("entityFormHost");
  if(!el) return;
  if(!entityForm){ el.classList.add("hidden"); el.innerHTML=""; return; }
  el.classList.remove("hidden");
  var isApprove=entityForm.mode==="approve-submission";
  var title = isApprove ? "مراجعة الاقتراح قبل الاعتماد" : (entityForm.mode==="edit" ? ("تعديل "+(ENTITY_TITLES[entityForm.entity]||"")) : ("إضافة "+(ENTITY_TITLES[entityForm.entity]||"")));
  var saveLabel = isApprove ? "اعتماد" : "حفظ";
  var senderNote = isApprove ? '<p class="confirm-sender">من صندوق العائلة — أرسلها: '+escapeHtml(entityForm.fields.senderName||"")+'</p>' : "";
  var actionBtn="";
  if(entityForm.mode==="edit"){
    actionBtn='<button type="button" class="btn btn-danger btn-sm confirm-danger" data-action="entity-delete">'+icon("trash")+' حذف</button>';
  }else if(isApprove){
    actionBtn='<button type="button" class="btn btn-danger btn-sm confirm-danger" data-action="confirm-reject-submission" data-id="'+entityForm.id+'">'+icon("close")+' رفض</button>';
  }
  el.innerHTML='<div class="entity-form-card"><form id="entityFormEl">'+
    '<p class="confirm-title">'+title+'</p>'+
    senderNote+
    entityFieldsHtml(entityForm)+
    '<div class="confirm-actions">'+
      actionBtn+
      '<button type="button" class="btn btn-ghost btn-sm" data-action="entity-cancel">إلغاء</button>'+
      '<button type="submit" class="btn btn-primary btn-sm">'+saveLabel+'</button>'+
    '</div>'+
  '</form></div>';
}
var FORM_TEXT_FIELDS={
  item:["title","date","note","forWhom"], request:["title","forWhom","assignee","date","note"],
  task:["task","assignee","forWhom","date","note"], bill:["name","type","accountNumber","provider","dueDate","responsible","note"],
  subscription:["name","owner","email","renewalDate","note"],
  vehicle:["name","owner","plateNumber","insuranceDate","registrationDate","inspectionDate","maintenanceNote","oilChangeDate","note"],
  number:["name","category","phone","note","forWhom"], reference:["person","entity","refType","refValue","note","category"],
  note:["person","text"]
};
var PRIMARY_FIELD={item:"title",request:"title",task:"task",bill:"name",subscription:"name",vehicle:"name",number:"name",reference:"refValue",note:"text"};
function collectFormInputs(entity, f){
  var keys=FORM_TEXT_FIELDS[entity]||[];
  keys.forEach(function(k){
    var el=document.getElementById("ef-"+k);
    if(el) f[k]=el.value.trim();
  });
}
function saveForm(){
  if(!entityForm) return;
  var f=entityForm.fields;
  collectFormInputs(entityForm.entity, f);
  var primary=PRIMARY_FIELD[entityForm.entity];
  if(!f[primary] || !String(f[primary]).trim()){ showToast("عبّي الحقل الأساسي قبل الحفظ"); return; }
  if((entityForm.entity==="reference" || entityForm.entity==="note") && !f.person){ showToast("اختر الشخص"); return; }
  if(entityForm.mode==="approve-submission"){
    var targetEntity = f.type==="طلب" ? "request" : "item";
    approveSubmission(entityForm.id, targetEntity==="request"?"طلب":(f.type||"مناسبة"), f.title, f.date, f.importance||"عادي", f.note).then(function(){
      closeForm(); renderApp(); showToast("تم الاعتماد، وأضيفت للوحة");
    }, function(){});
    return;
  }
  var mode=entityForm.mode, id=entityForm.id, entity=entityForm.entity;
  saveEntity(entity, mode, id, f).then(function(){
    closeForm();
    renderApp();
    showToast(mode==="edit" ? "تم التحديث" : "تمت الإضافة");
    logActivity(activityTextFor(entity, mode, f), entity);
  }, function(){});
}
function deleteFormTarget(){
  if(!entityForm || entityForm.mode!=="edit") return;
  var entity=entityForm.entity, id=entityForm.id;
  deleteEntity(entity, id).then(function(removed){
    closeForm(); renderApp();
    if(removed) showToast("تم الحذف");
  }, function(){});
}

/* ---------- family submissions (صندوق العائلة) ---------- */
function addSubmission(senderName,text,suggestedType,suggestedDate){
  var row={sender_name:senderName, text:text, suggested_type:suggestedType||null, suggested_date:suggestedDate||null, status:"pending", source:"dashboard"};
  return sb.from("family_submissions").insert(row).then(function(res){
    if(res.error){ showToast("تعذّر إرسال اقتراحك، حاول مرة ثانية"); throw res.error; }
  });
}
function approveSubmission(id,type,title,date,importance,note){
  var s=state.submissions.find(function(x){ return x.id===id; });
  var senderName = s ? s.senderName : "";
  var addPromise = (type==="طلب")
    ? saveEntity("request","add",null,{title:title,importance:importance,note:note,addedBy:senderName})
    : saveEntity("item","add",null,{type:type,title:title,date:date||toISO(today),importance:importance,note:note,addedBy:senderName});
  return addPromise.then(function(){
    return sb.from("family_submissions").update({status:"approved"}).eq("id",id);
  }).then(function(res){
    if(res && res.error){ showToast("تمت الإضافة لكن تعذّر تحديث حالة الاقتراح"); }
    state.submissions = state.submissions.filter(function(x){ return x.id!==id; });
  });
}
function rejectSubmission(id){
  var s=state.submissions.find(function(x){ return x.id===id; });
  return sb.from("family_submissions").update({status:"rejected"}).eq("id",id).then(function(res){
    if(res.error){ showToast("تعذّر الرفض"); throw res.error; }
    state.submissions = state.submissions.filter(function(x){ return x.id!==id; });
    return s;
  });
}
function openConfirmForApproveSubmission(id){
  var s=state.submissions.find(function(x){ return x.id===id; });
  if(!s) return;
  entityForm={entity:(s.suggestedType==="طلب"?"request":"item"), mode:"approve-submission", id:id,
    fields:{title:s.text, type:s.suggestedType||"مناسبة", date:s.suggestedDate||toISO(today), importance:"عادي", note:"", forWhom:"", senderName:s.senderName}};
  renderFormPanel();
  scrollToForm();
}

/* ---------- mood ---------- */
function setMood(person, mood, note){
  if(!isAdmin){ showToast("سجّل دخول كمدير أول"); return Promise.resolve(); }
  var row={person:person, mood:mood, note:note||"", mood_date:toISO(today)};
  return sb.from("moods").upsert(row,{onConflict:"person,mood_date"}).select().single().then(function(res){
    if(res.error){ showToast("تعذّر حفظ المزاج"); throw res.error; }
    var mapped=rowToMood(res.data);
    var idx=state.moods.findIndex(function(m){ return m.person===person && m.moodDate===mapped.moodDate; });
    if(idx>=0) state.moods[idx]=mapped; else state.moods.unshift(mapped);
    renderApp();
    showToast("تم تحديث المزاج");
  }, function(){});
}

/* ---------- calendar (shared card, used on home-less section page) ---------- */
function dotColorVar(kind){
  if(kind==="urgent") return "urgent";
  if(kind==="warn") return "gold";
  if(kind==="appt") return "sky";
  if(kind==="birthday") return "lavender-ink";
  if(kind==="national") return "blue-ink";
  return "green-600";
}
function renderCalendarCard(){
  var first=new Date(viewYear,viewMonth,1);
  var startDow=first.getDay();
  var daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  var todayIso=toISO(todayDate());
  var cells="";
  var i,d;
  for(i=0;i<startDow;i++){ cells+='<div class="cal-cell empty"></div>'; }
  for(d=1; d<=daysInMonth; d++){
    var iso=viewYear+"-"+pad(viewMonth+1)+"-"+pad(d);
    var dayItems=state.items.filter(function(it){ return it.date===iso; });
    var isToday=iso===todayIso;
    var chipsHtml=dayItems.slice(0,2).map(function(it){
      return '<div class="cal-chip k-'+chipKind(it)+'" data-action="edit-item" data-id="'+it.id+'">'+escapeHtml(it.title)+'</div>';
    }).join("");
    var more=dayItems.length>2?'<div class="cal-more">+'+(dayItems.length-2)+'</div>':"";
    cells+='<button type="button" class="cal-cell'+(isToday?" today":"")+(dayItems.length?" has-items":"")+'" data-action="day-cell" data-date="'+iso+'"><span class="cal-daynum">'+d+'</span>'+chipsHtml+more+'</button>';
  }
  var weekdaysHtml=WEEKDAYS_SHORT.map(function(w){ return "<span>"+w+"</span>"; }).join("");
  return '<div class="card">'+
    '<div class="cal-head">'+
      '<button type="button" class="cal-nav-btn" data-action="next-month" aria-label="الشهر التالي">‹</button>'+
      '<span class="cal-month-title">'+MONTHS[viewMonth]+' '+viewYear+'</span>'+
      '<button type="button" class="cal-nav-btn" data-action="prev-month" aria-label="الشهر السابق">›</button>'+
    '</div>'+
    '<div class="cal-weekdays">'+weekdaysHtml+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
  '</div>';
}

/* ---------- status-change helpers (quick actions without opening the full form) ---------- */
function toggleRequestDone(id){
  var r=state.requests.find(function(x){return x.id===id;});
  if(!r) return;
  var newStatus = r.status==="تم" ? "جديد" : "تم";
  sb.from("requests").update({status:newStatus}).eq("id",id).select().single().then(function(res){
    if(res.error){ showToast("تعذّر التحديث"); return; }
    Object.assign(r, rowToRequest(res.data));
    renderApp();
  });
}
function markRequestProgress(id){
  sb.from("requests").update({status:"جاري"}).eq("id",id).select().single().then(function(res){
    if(res.error){ showToast("تعذّر التحديث"); return; }
    var r=state.requests.find(function(x){return x.id===id;});
    if(r) Object.assign(r, rowToRequest(res.data));
    renderApp();
  });
}
function deleteRequestQuick(id){
  deleteEntity("request", id).then(function(removed){
    renderApp();
    if(removed) showToast("تم حذف الطلب","تراجع",function(){ saveEntity("request","add",null,{title:removed.text,importance:removed.importance,note:removed.note,forWhom:removed.forWhom,assignee:removed.assignee,addedBy:removed.addedBy}).then(renderApp); });
  }, function(){});
}
function toggleTaskDone(id){
  var t=state.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var newStatus = t.status==="مكتمل" ? "جديد" : "مكتمل";
  sb.from("tasks").update({status:newStatus}).eq("id",id).select().single().then(function(res){
    if(res.error){ showToast("تعذّر التحديث"); return; }
    Object.assign(t, rowToTask(res.data));
    renderApp();
    if(newStatus==="مكتمل") logActivity("تم إكمال مهمة: "+t.task, "task");
  });
}

/* ---------- event delegation ---------- */
function onAppClick(e){
  var fab=e.target.closest("#fabAdd");
  if(fab){
    if(route.page==="person"){
      var g=document.getElementById("personAddGrid");
      if(g) g.scrollIntoView({behavior:"smooth", block:"center"});
    }else if(route.page==="section"){
      var ent=SECTION_DEFAULT_ENTITY[route.section];
      if(ent) openForm(ent, {}, "add", null, null);
    }
    return;
  }
  var t=e.target.closest("[data-action]");
  if(!t) return;
  var action=t.dataset.action;
  var id=t.dataset.id;

  if(action==="admin-login-toggle"){ showAdminLogin=!showAdminLogin; renderApp(); }
  else if(action==="admin-login-cancel"){ showAdminLogin=false; renderApp(); }
  else if(action==="admin-login-send"){
    var emailInput=document.getElementById("adminEmailInput");
    var email=emailInput?emailInput.value.trim():"";
    if(!email){ showToast("اكتب بريدك الإلكتروني"); return; }
    requestMagicLink(email).then(function(res){
      if(res.error){ showToast("تعذّر إرسال الرابط، حاول مرة ثانية"); return; }
      showAdminLogin=false;
      renderApp();
      showToast("تم إرسال رابط الدخول — افتحه من بريدك على نفس الجهاز");
    });
  }
  else if(action==="admin-logout"){ signOutAdmin().then(function(){ renderApp(); }); }
  else if(action==="save-identity"){
    var nameInput=document.getElementById("identityInput");
    var nm=nameInput?nameInput.value.trim():"";
    if(nm){ setDisplayName(nm); renderApp(); }
  }
  else if(action==="clear-search"){ searchQuery=""; var si=document.getElementById("searchInput"); if(si) si.value=""; updateSearchUI(); }
  else if(action==="open-add"){
    if(!isAdmin) return;
    var entity=t.dataset.entity, person=t.dataset.person, presetType=t.dataset.type;
    var presetFields={};
    if(route.page==="person"){ person=route.person; }
    if(person){
      if(entity==="reference" || entity==="note") presetFields.person=person;
      else presetFields.forWhom=person;
    }
    if(presetType) presetFields.type=presetType;
    openForm(entity, presetFields, "add", null, person||null);
  }
  else if(action==="ef-chip"){ if(entityForm){ entityForm.fields[t.dataset.field]=t.dataset.value; renderFormPanel(); } }
  else if(action==="entity-cancel"){ closeForm(); }
  else if(action==="entity-delete"){ deleteFormTarget(); }
  else if(action==="edit-item"){ openEditGeneric("item", id); }
  else if(action==="edit-request"){ openEditGeneric("request", id); }
  else if(action==="edit-task"){ openEditGeneric("task", id); }
  else if(action==="edit-bill"){ openEditGeneric("bill", id); }
  else if(action==="edit-subscription"){ openEditGeneric("subscription", id); }
  else if(action==="edit-vehicle"){ openEditGeneric("vehicle", id); }
  else if(action==="edit-number"){ openEditGeneric("number", id); }
  else if(action==="edit-reference"){ openEditGeneric("reference", id); }
  else if(action==="edit-note"){ openEditGeneric("note", id); }
  else if(action==="toggle-favorite"){ toggleFavorite(t.dataset.entity, id); }
  else if(action==="toggle-done"){ if(isAdmin) toggleRequestDone(id); }
  else if(action==="mark-progress"){ if(isAdmin) markRequestProgress(id); }
  else if(action==="delete-request"){ if(isAdmin) deleteRequestQuick(id); }
  else if(action==="toggle-task-done"){ if(isAdmin) toggleTaskDone(id); }
  else if(action==="set-mood"){ setMood(t.dataset.person, t.dataset.mood, ""); }
  else if(action==="next-month"){ viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} renderApp(); }
  else if(action==="prev-month"){ viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} renderApp(); }
  else if(action==="day-cell"){
    if(!isAdmin) return;
    openForm("item", {type:"مناسبة", date:t.dataset.date}, "add", null, null);
  }
  else if(action==="approve-submission"){ if(isAdmin) openConfirmForApproveSubmission(id); }
  else if(action==="edit-submission"){ if(isAdmin) openConfirmForApproveSubmission(id); }
  else if(action==="reject-submission"){
    if(!isAdmin) return;
    rejectSubmission(id).then(function(rs){
      renderApp();
      if(rs){ showToast("تم الرفض","تراجع",function(){ sb.from("family_submissions").update({status:"pending"}).eq("id",id).then(function(){ return loadPending(); }).then(renderApp); }); }
    }, function(){});
  }
  else if(action==="confirm-reject-submission"){
    if(!isAdmin) return;
    rejectSubmission(id).then(function(rs){
      closeForm();
      renderApp();
      if(rs){ showToast("تم الرفض"); }
    }, function(){});
  }
}
function onAppSubmit(e){
  if(e.target && e.target.id==="entityFormEl"){
    e.preventDefault();
    saveForm();
  }else if(e.target && e.target.id==="familyboxForm"){
    e.preventDefault();
    var nameEl=document.getElementById("familyboxName");
    var textEl=document.getElementById("familyboxText");
    var name=nameEl.value.trim(), text=textEl.value.trim();
    if(!name||!text) return;
    setDisplayName(name);
    var parsed2=parseQuickAdd(text);
    var submitBtn=e.target.querySelector('button[type=submit]');
    if(submitBtn) submitBtn.disabled=true;
    addSubmission(name, text, parsed2.type, parsed2.type==="طلب"?null:parsed2.date).then(function(){
      textEl.value="";
      showToast("تم إرسالها للعائلة ✅");
    }, function(){}).then(function(){
      if(submitBtn) submitBtn.disabled=false;
    });
  }
}
var searchDebounce=null;
function onAppInput(e){
  if(e.target && e.target.id==="searchInput"){
    searchQuery=e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce=setTimeout(updateSearchUI,120);
  }
}

/* ---------- init ---------- */
function init(){
  var app=document.getElementById("app");
  app.addEventListener("click", onAppClick);
  app.addEventListener("submit", onAppSubmit);
  app.addEventListener("input", onAppInput);

  window.addEventListener("hashchange", function(){
    route=parseRoute();
    entityForm=null;
    renderApp();
    window.scrollTo(0,0);
  });

  renderApp();

  if(!sb){
    dbStatus="error";
    renderApp();
    return;
  }

  sb.auth.onAuthStateChange(function(_event, sess){
    session=sess;
    isAdmin=!!(session && session.user && isAllowedAdminEmail(session.user.email));
    if(window.location.hash && window.location.hash.indexOf("access_token")>-1){
      handleAuthRedirectReturnRoute();
      route=parseRoute();
    }
    loadPending().then(renderApp);
  });

  refreshAuthState().then(function(){
    return Promise.all([loadDashboard(), loadPending()]);
  }).then(function(){
    renderApp();
  }, function(){
    dbStatus="error";
    renderApp();
  });
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
}else{
  init();
}
})();
</script>
</body>
</html>
